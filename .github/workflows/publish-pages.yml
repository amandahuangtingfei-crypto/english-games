name: Publish GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble Unit 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/unit3 site/unit3
          gh release download pu2-unit3-20261027 --repo "$GITHUB_REPOSITORY" --pattern 'unit3-web.part*' --dir /tmp/unit3
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          files = sorted(Path('/tmp/unit3').glob('unit3-web.part*'))
          assert len(files) == 24, f'expected 24 release parts, found {len(files)}'
          out = Path('/tmp/unit3.zip')
          with out.open('wb') as dst:
              for part in files:
                  dst.write(part.read_bytes())
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          assert digest == '011507ed4ebb3319293975a0a5395e1a75b17374671be8c36faeb2ed14886cc2', digest
          with zipfile.ZipFile(out) as archive:
              assert archive.testzip() is None
              archive.extractall('/tmp/unit3-extracted')
          PY
          cp -R /tmp/unit3-extracted/. site/unit3/
          mkdir -p site/unit3/images
          cp -R unit3-overlay/. site/unit3/
      - name: Keep existing games and add courseware index
        run: |
          mkdir -p site
          for f in *.html; do [ -e "$f" ] && cp "$f" site/; done
          cat > site/index.html <<'HTML'
          <!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Games & Power Up 2</title><style>body{font:18px system-ui,sans-serif;max-width:760px;margin:48px auto;padding:0 20px;color:#18353b}a{color:#075c86}li{margin:12px 0}</style><h1>English Games & Power Up 2</h1><h2><a href="./unit3/html_elements/unit3-classroom.html">Open Power Up 2 · Unit 3</a></h2><p>Unit 3 classroom courseware. Textbook media may take a moment to load.</p><h2>English Games</h2><ul><li><a href="./bad-monday.html">Bad Monday</a></li><li><a href="./book2-unit8-practice-1013.html">Book 2 Unit 8 Practice</a></li><li><a href="./book2-unit8-practice-1013b.html">Book 2 Unit 8 Practice B</a></li><li><a href="./book2-unit8-practice-1024.html">Book 2 Unit 8 Practice (Oct 24)</a></li><li><a href="./fred-game.html">Fred Game</a></li><li><a href="./grammar-2-and-ice-cream-nose.html">Grammar 2 and Ice Cream Nose</a></li><li><a href="./lets-be-healthy.html">Let’s Be Healthy</a></li><li><a href="./must-single.html">Must Single</a></li><li><a href="./plants-article.html">Plants Article</a></li><li><a href="./plants-game.html">Plants Game</a></li><li><a href="./shapes.html">Shapes</a></li></ul></html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
